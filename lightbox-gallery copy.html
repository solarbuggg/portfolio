<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightbox Gallery</title>
<style>
  :root {
    --gap: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #fff;
    color: #111;
  }

  /* ---------- GRID ---------- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
    max-width: 1000px;
    margin: 60px auto;
    padding: 0 20px;
  }

  .gallery img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
    transition: opacity 0.15s ease;
  }

  .gallery img:hover {
    opacity: 0.85;
  }

  /* ---------- LIGHTBOX OVERLAY ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(235, 235, 235, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .lightbox.is-open {
    display: flex;
    opacity: 1;
  }

  .lightbox-image-wrap {
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
    user-select: none;
  }

  /* ---------- CAPTION (title, medium, year, dimensions) ---------- */
  .lightbox-caption {
    position: fixed;
    left: 32px;
    bottom: 28px;
    z-index: 100;
    max-width: 40vw;
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: #1a1a1a;
    /* preserves manual line breaks from the data attribute (e.g. "Title\nmedium, year, dimensions") */
    white-space: pre-line;
  }

  /* ---------- CLOSE BUTTON ---------- */
  .lightbox-close {
    position: fixed;
    top: 24px;
    right: 32px;
    width: 36px;
    height: 36px;
    background: none;
    border: none;
    cursor: pointer;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-close svg {
    width: 22px;
    height: 22px;
  }

  .lightbox-close:hover {
    opacity: 0.7;
  }

  /* ---------- PREV / NEXT ARROWS ---------- */
  .lightbox-nav {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 80px;
    background: none;
    border: none;
    cursor: pointer;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    opacity: 0.85;
  }

  .lightbox-nav:hover {
    opacity: 1;
  }

  .lightbox-nav svg {
    width: 26px;
    height: 26px;
  }

  .lightbox-prev {
    left: 0;
    justify-content: flex-start;
    padding-left: 20px;
  }

  .lightbox-next {
    right: 0;
    justify-content: flex-end;
    padding-right: 20px;
  }

  @media (max-width: 480px) {
    .lightbox-nav { width: 50px; }
    .lightbox-caption { max-width: 70vw; left: 20px; bottom: 20px; }
  }
</style>
</head>
<body>

<!-- ============ GALLERY GRID ============ -->
<!-- data-title / data-caption holds the info shown in the lightbox -->
<div class="gallery" id="gallery">
  <img src="https://placehold.co/800x600/222/fff?text=1"
       alt="Image 1"
       data-full="https://placehold.co/1600x1000/222/fff?text=1"
       data-caption="Untitled I&#10;Oil on canvas, 2025, 24 x 36 in">

  <img src="https://placehold.co/800x600/444/fff?text=2"
       alt="Image 2"
       data-full="https://placehold.co/1200x1600/444/fff?text=2"
       data-caption="Seated figure&#10;Oil on canvas, 2025, 20 x 30 in">

  <img src="https://placehold.co/800x600/666/fff?text=3"
       alt="Image 3"
       data-full="https://placehold.co/1600x900/666/fff?text=3"
       data-caption="Still life with drapery&#10;Oil on canvas, 2024, 18 x 24 in">

  <img src="https://placehold.co/800x600/888/fff?text=4"
       alt="Image 4"
       data-full="https://placehold.co/1600x1000/888/fff?text=4"
       data-caption="Portrait study&#10;Charcoal on paper, 2024, 16 x 20 in">

  <img src="https://placehold.co/800x600/aaa/fff?text=5"
       alt="Image 5"
       data-full="https://placehold.co/1000x1600/aaa/fff?text=5"
       data-caption="Untitled II&#10;Oil on canvas, 2025, 30 x 40 in">

  <img src="https://placehold.co/800x600/ccc/000?text=6"
       alt="Image 6"
       data-full="https://placehold.co/1600x1100/ccc/000?text=6"
       data-caption="Interior&#10;Oil on canvas, 2023, 22 x 28 in">
</div>

<!-- ============ LIGHTBOX OVERLAY ============ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">

  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="4" y1="4" x2="20" y2="20"/>
      <line x1="20" y1="4" x2="4" y2="20"/>
    </svg>
  </button>

  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="15 4 7 12 15 20"/>
    </svg>
  </button>

  <div class="lightbox-image-wrap">
    <img id="lightboxImage" src="" alt="">
  </div>

  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="9 4 17 12 9 20"/>
    </svg>
  </button>

  <!-- Title / medium / year / dimensions, bottom-left -->
  <p class="lightbox-caption" id="lightboxCaption"></p>

</div>

<script>
(function () {
  const galleryImgs = Array.from(document.querySelectorAll('#gallery img'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const btnClose = document.getElementById('lightboxClose');
  const btnPrev = document.getElementById('lightboxPrev');
  const btnNext = document.getElementById('lightboxNext');

  let currentIndex = 0;

  function getFullSrc(imgEl) {
    return imgEl.dataset.full || imgEl.src;
  }

  function updateLightbox() {
    const img = galleryImgs[currentIndex];
    lightboxImage.src = getFullSrc(img);
    lightboxImage.alt = img.alt || '';
    // data-caption drives the title/medium/year/dimensions text;
    // falls back to alt text, or clears if neither is set
    lightboxCaption.textContent = img.dataset.caption || img.alt || '';
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % galleryImgs.length;
    updateLightbox();
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + galleryImgs.length) % galleryImgs.length;
    updateLightbox();
  }

  galleryImgs.forEach((img, i) => {
    img.addEventListener('click', () => openLightbox(i));
  });

  btnClose.addEventListener('click', closeLightbox);
  btnNext.addEventListener('click', showNext);
  btnPrev.addEventListener('click', showPrev);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrev();
  });
})();
</script>

</body>
</html>
