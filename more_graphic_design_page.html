<!-- ============ LIGHTBOX OVERLAY ============ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">

  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="4" y1="4" x2="20" y2="20"/>
      <line x1="20" y1="4" x2="4" y2="20"/>
    </svg>
  </button>

  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="15 4 7 12 15 20"/>
    </svg>
  </button>

  <div class="lightbox-image-wrap">
    <img id="lightboxImage" src="" alt="">
    <video id="lightboxVideo" controls playsinline></video>
  </div>

  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="9 4 17 12 9 20"/>
    </svg>
  </button>

  <p class="lightbox-caption" id="lightboxCaption">
    <span class="lightbox-caption-title" id="lightboxCaptionTitle"></span>
    <span class="lightbox-caption-details" id="lightboxCaptionDetails"></span>
  </p>

</div>

<script>
(function () {
const galleryItems = Array.from(document.querySelectorAll('#gallery img, #gallery video'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const lightboxVideo = document.getElementById('lightboxVideo');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxCaptionTitle = document.getElementById('lightboxCaptionTitle');
  const lightboxCaptionDetails = document.getElementById('lightboxCaptionDetails');
  const btnClose = document.getElementById('lightboxClose');
  const btnPrev = document.getElementById('lightboxPrev');
  const btnNext = document.getElementById('lightboxNext');

  let currentIndex = 0;

  function getFullSrc(el) {
    return el.dataset.full || el.currentSrc || el.src;
  }

  function updateLightbox() {
  const el = galleryItems[currentIndex]; // was galleryImgs — see note below
  const isVideo = el.tagName === 'VIDEO';

  lightboxVideo.pause();
  lightboxVideo.currentTime = 0;

  if (isVideo) {
    lightboxVideo.src = getFullSrc(el);
    lightboxVideo.style.display = 'block';
    lightboxImage.style.display = 'none';
    lightboxVideo.play();
  } else {
    lightboxImage.src = getFullSrc(el);
    lightboxImage.alt = el.alt || '';
    lightboxImage.style.display = 'block';
    lightboxVideo.style.display = 'none';
  }

  const raw = el.dataset.caption || el.alt || '';
  const [title, details] = raw.split('|').map(s => (s || '').trim());
  lightboxCaptionTitle.textContent = title || '';
  lightboxCaptionDetails.textContent = details || '';
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lightboxVideo.pause();
    lightboxVideo.currentTime = 0;
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % galleryItems.length;
    updateLightbox();
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
    updateLightbox();
  }

  // Open on thumbnail click
  galleryItems.forEach((img, i) => {
    img.addEventListener('click', () => openLightbox(i));
  });

  btnClose.addEventListener('click', closeLightbox);
  btnNext.addEventListener('click', showNext);
  btnPrev.addEventListener('click', showPrev);

  // Click outside the image (on the dark backdrop) also closes it
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  // Keyboard controls: Esc to close, arrows to navigate
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrev();
  });
})();
</script>
