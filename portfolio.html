<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nastia Honcharenko — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-muted: #b3b3b3;
    --border-color: #1a1a1a;
    --placeholder-bg: #cfcfcf;
    --bg: #ffffff;
    --gap-x: 20px;
    --gap-y: 56px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Arimo', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 60px 18px 30px;
    border-bottom: 1px solid var(--border-color);
  }

  header nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .site-title,
  .nav-link {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
    text-decoration: none;
  }

  .site-title { cursor: default; }

  main {
    width: 100%;
    padding: 48px 30px 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: var(--gap-x);
    row-gap: var(--gap-y);
  }

  .card {
    display: flex;
    flex-direction: column;
  }

  .card-image {
    width: 100%;
    aspect-ratio: 470 / 245;
    background: var(--placeholder-bg);
    display: block;
    object-fit: cover;
  }

  .card-category {
    margin-top: 18px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }

  .card-title {
    margin-top: 4px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  @media (max-width: 640px) {
    main { padding-left: 20px; padding-right: 20px; }
    .grid { grid-template-columns: 1fr; row-gap: 40px; }
  }
</style>
</head>
<body>

<header>
  <nav>
    <span class="site-title">NASTIA HONCHARENKO</span>
    <a class="nav-link" href="#">WORK</a>
    <a class="nav-link" href="#">ARCHIVE</a>
    <a class="nav-link" href="#">INFO</a>
  </nav>
</header>

<main>
  <div class="grid">
    <!-- Repeat this .card block for each project. Swap the src on .card-image,
         and edit .card-category / .card-title text. -->
    <div class="card">
      <img class="card-image" src="https://placehold.co/940x490/cfcfcf/cfcfcf" alt="Kyiv Tour Guide">
      <span class="card-category">Layout Design, Publication</span>
      <span class="card-title">KYIV TOUR GUIDE</span>
    </div>

    <div class="card">
      <img class="card-image" src="https://placehold.co/940x490/cfcfcf/cfcfcf" alt="Kyiv Tour Guide">
      <span class="card-category">Layout Design, Publication</span>
      <span class="card-title">KYIV TOUR GUIDE</span>
    </div>

    <div class="card">
      <img class="card-image" src="https://placehold.co/940x490/cfcfcf/cfcfcf" alt="Kyiv Tour Guide">
      <span class="card-category">Layout Design, Publication</span>
      <span class="card-title">KYIV TOUR GUIDE</span>
    </div>

    <div class="card">
      <img class="card-image" src="https://placehold.co/940x490/cfcfcf/cfcfcf" alt="Kyiv Tour Guide">
      <span class="card-category">Layout Design, Publication</span>
      <span class="card-title">KYIV TOUR GUIDE</span>
    </div>

    <div class="card">
      <img class="card-image" src="https://placehold.co/940x490/cfcfcf/cfcfcf" alt="Kyiv Tour Guide">
      <span class="card-category">Layout Design, Publication</span>
      <span class="card-title">KYIV TOUR GUIDE</span>
    </div>

    <div class="card">
      <img class="card-image" src="https://placehold.co/940x490/cfcfcf/cfcfcf" alt="Kyiv Tour Guide">
      <span class="card-category">Layout Design, Publication</span>
      <span class="card-title">KYIV TOUR GUIDE</span>
    </div>
  </div>
</main>

</body>
</html>
